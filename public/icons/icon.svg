<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <rect width="512" height="512" rx="96" ry="96" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.15"/>
  <!-- Decorative circle ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.1"/>
  <!-- "CN" text -->
  <text x="256" y="300" 
    font-family="'Arial Black', 'Arial Bold', sans-serif" 
    font-size="180" 
    font-weight="900"
    text-anchor="middle" 
    fill="white"
    filter="url(#glow)"
    letter-spacing="-8">CN</text>
  <!-- Accent underline -->
  <rect x="156" y="320" width="200" height="6" rx="3" fill="url(#accent)" opacity="0.9"/>
  <!-- Small stars/sparkles -->
  <circle cx="140" cy="170" r="6" fill="#a78bfa" opacity="0.7"/>
  <circle cx="372" cy="170" r="4" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="390" cy="340" r="5" fill="#a78bfa" opacity="0.6"/>
  <circle cx="122" cy="350" r="3" fill="#c4b5fd" opacity="0.4"/>
</svg>
